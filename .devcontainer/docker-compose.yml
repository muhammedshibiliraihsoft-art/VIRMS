services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: virms_local
      POSTGRES_USER: virms_local
      POSTGRES_PASSWORD: ${VIRMS_LOCAL_DB_PASSWORD:?Set VIRMS_LOCAL_DB_PASSWORD locally}
    volumes:
      - virms_postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: ..
      dockerfile: Dockerfile.dev
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      DJANGO_ENV: local
      DJANGO_SECRET_KEY: ${VIRMS_LOCAL_SECRET_KEY:?Set VIRMS_LOCAL_SECRET_KEY locally}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: virms_local
      DB_USER: virms_local
      DB_PASSWORD: ${VIRMS_LOCAL_DB_PASSWORD:?Set VIRMS_LOCAL_DB_PASSWORD locally}
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      - db

volumes:
  virms_postgres_data:
